
name: Build Flow INR APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-inr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flow INR APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate uploaded files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            "Flow-INR-Android-Project.zip" \
            "index.html" \
            "flow_icon.png"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty file: $file"
              exit 1
            fi
          done

          echo "Required files found."

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted-project
          unzip -q Flow-INR-Android-Project.zip \
            -d extracted-project

          SETTINGS_FILE="$(find extracted-project \
            -type f -name settings.gradle \
            -not -path '*/.gradle/*' -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            SETTINGS_FILE="$(find extracted-project \
              -type f -name settings.gradle.kts \
              -not -path '*/.gradle/*' -print -quit)"
          fi

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::No settings.gradle found in the ZIP."
            echo "Upload the actual Android project ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [[ ! -d "$PROJECT_DIR/app" ]]; then
            echo "::error::The project root has no app directory."
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/build.gradle" && \
                ! -f "$PROJECT_DIR/build.gradle.kts" ]]; then
            echo "::error::Root build.gradle is missing."
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" \
            >> "$GITHUB_ENV"

          echo "Found Android project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate missing Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          if [[ ! -f gradlew || \
                ! -f gradle/wrapper/gradle-wrapper.properties || \
                ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "Gradle wrapper missing. Generating it..."
            gradle wrapper --gradle-version 8.9
          fi

          if [[ ! -f gradlew || \
                ! -f gradle/wrapper/gradle-wrapper.jar || \
                ! -f gradle/wrapper/gradle-wrapper.properties ]]; then
            echo "::error::Gradle wrapper generation failed."
            exit 1
          fi

          chmod +x gradlew
          echo "Gradle wrapper is ready."

      - name: Install custom app icon
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$ANDROID_PROJECT_DIR"
          ICON_DIR="$PROJECT/app/src/main/res/drawable-nodpi"

          mkdir -p "$ICON_DIR"
          cp flow_icon.png "$ICON_DIR/flow_icon.png"

          test -s "$ICON_DIR/flow_icon.png"

      - name: Install optimized HTML
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$ANDROID_PROJECT_DIR"
          ASSETS="$PROJECT/app/src/main/assets"

          mkdir -p "$ASSETS"
          cp index.html "$ASSETS/index.html"

          test -s "$ASSETS/index.html"
          echo "Optimized HTML installed."

      - name: Configure application icon
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$ANDROID_PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [[ ! -f "$MANIFEST" ]]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          app_match = re.search(r"<application\b[^>]*>", text)

          if not app_match:
              raise SystemExit("No application tag found in manifest.")

          tag = app_match.group(0)

          if re.search(r'\bandroid:icon\s*=', tag):
              tag = re.sub(
                  r'\bandroid:icon\s*=\s*("[^"]*"|\'[^\']*\')',
                  'android:icon="@drawable/flow_icon"',
                  tag,
                  count=1,
              )
          else:
              tag = tag[:-1] + ' android:icon="@drawable/flow_icon">'

          text = text[:app_match.start()] + tag + text[app_match.end():]
          path.write_text(text, encoding="utf-8")

          print("Application icon configured.")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated."
            find "$ANDROID_PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"
          echo "APK build successful."

      - name: Upload Flow INR debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Flow-INR-debug-apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
